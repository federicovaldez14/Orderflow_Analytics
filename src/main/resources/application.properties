server.port=8080

# --- Base de datos (adaptador JDBC) ---
# H2 en memoria: cada arranque empieza limpio. Para conservar datos entre
# ejecuciones cambie a: jdbc:h2:file:./data/orderflow;DB_CLOSE_DELAY=-1
# LOCK_TIMEOUT: con muchos pedidos a la vez, una transaccion espera hasta 10 s
# el candado de fila de un ingrediente en vez de fallar al primer segundo.
spring.datasource.url=jdbc:h2:mem:orderflow;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
# Pool de conexiones (HikariCP). Leccion PERF-01 del taller de carga.
spring.datasource.hikari.maximum-pool-size=20

# --- Restaurante ---
orderflow.mesas=10
# Abre la ventana del POS (Swing). Para pruebas de carga: --orderflow.ui.enabled=false
orderflow.ui.enabled=true
# Carga ~7 dias de pedidos cerrados para que la analitica tenga datos en la demo.
orderflow.demo.historico=true
# Vigencia (s) de la cache del panel de analitica; 0 = sin cache (recalcula en cada consulta).
# Mitigacion del cuello de botella encontrado en la prueba de carga (docs/pruebas.md).
orderflow.analitica.cache-segundos=3

# --- Seguridad ---
# Primer administrador (se crea si la tabla de usuarios está vacía). Sin clave definida
# se genera una aleatoria y se muestra una sola vez en el log. Nunca poner la clave aquí.
orderflow.seguridad.admin-usuario=${ORDERFLOW_ADMIN_USUARIO:admin}
orderflow.seguridad.admin-clave=${ORDERFLOW_ADMIN_CLAVE:}
# Usuario opcional de solo lectura de métricas para Prometheus (perfil observabilidad de Compose)
orderflow.seguridad.monitor-usuario=${ORDERFLOW_MONITOR_USUARIO:}
orderflow.seguridad.monitor-clave=${ORDERFLOW_MONITOR_CLAVE:}
# Cookie de sesión: no legible desde JavaScript, solo en el mismo sitio; Secure en HTTPS (Render)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${ORDERFLOW_COOKIE_SEGURA:false}
server.servlet.session.timeout=8h
# Detrás del proxy HTTPS de Render: respetar X-Forwarded-Proto
server.forward-headers-strategy=native
# Los errores no muestran trazas ni mensajes internos
server.error.include-stacktrace=never
server.error.include-message=never

# --- Observabilidad (igual que el taller de carga) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# /actuator/info muestra la versión desplegada (SHA del commit); el pipeline la usa para saber
# cuándo quedó en línea la versión nueva
management.info.env.enabled=true
info.app.name=orderflow-analytics
info.app.version=${ORDERFLOW_VERSION:dev}
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
# /actuator/health/liveness y /readiness (los usa el HEALTHCHECK del Dockerfile)
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

spring.main.banner-mode=off
logging.level.com.restaurant.infraestructura.notificacion=INFO
