server.port=8080

# --- Base de datos (adaptador JDBC) ---
# H2 en memoria: cada arranque empieza limpio. Para conservar datos entre
# ejecuciones cambie a: jdbc:h2:file:./data/orderflow;DB_CLOSE_DELAY=-1
# LOCK_TIMEOUT: con muchos pedidos a la vez, una transaccion espera hasta 10 s
# el candado de fila de un ingrediente en vez de fallar al primer segundo.
spring.datasource.url=jdbc:h2:mem:orderflow;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
# Pool de conexiones (HikariCP). Leccion PERF-01 del taller de carga.
spring.datasource.hikari.maximum-pool-size=20

# --- Restaurante ---
orderflow.mesas=10
# Abre la ventana del POS (Swing). Para pruebas de carga: --orderflow.ui.enabled=false
orderflow.ui.enabled=true
# Carga ~7 dias de pedidos cerrados para que la analitica tenga datos en la demo.
orderflow.demo.historico=true

# --- Observabilidad (igual que el taller de carga) ---
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

spring.main.banner-mode=off
logging.level.com.restaurant.infraestructura.notificacion=INFO
