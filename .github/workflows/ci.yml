# Integración continua: en cada push o pull request compila y corre las
# pruebas unitarias e de integración (mvn verify). Es la base del pipeline
# del Corte 3.
name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pruebas unitarias + integración + cobertura
        run: mvn -B verify
      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
