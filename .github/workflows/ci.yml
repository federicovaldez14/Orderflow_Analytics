# Integración continua: en cada push o pull request compila y corre las
# pruebas unitarias y de integración (mvn verify). Es la base del pipeline
# del Corte 3.
name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pruebas unitarias + integración + cobertura
        run: mvn -B verify
      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/

  # Pruebas de UI (Selenium) sobre el POS web: Chrome sin ventana, que ya viene
  # instalado en ubuntu-latest. Selenium Manager descarga el driver.
  pruebas-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pruebas de UI (Selenium + Page Object Model)
        run: mvn -B verify -Pui-tests -Dit.test=PosWebUiIT -Dui.navegador=chrome
      - name: Publicar reporte de las pruebas de UI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas-ui
          path: target/failsafe-reports/
