# Dependabot propone actualizaciones semanales. No reemplaza el control de SCA del
# pipeline (Trivy): cada pull request de Dependabot pasa por el mismo pipeline.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      parches-y-menores:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # El sistema se construye y prueba con Java 17 (LTS). Un salto de versión de Java no es una
    # actualización de rutina: se decide aparte (con su ADR) y se cambia a mano en las dos imágenes.
    ignore:
      - dependency-name: eclipse-temurin
        versions: [">= 18"]
      - dependency-name: maven
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
